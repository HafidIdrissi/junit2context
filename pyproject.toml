[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "junit2context"
version = "0.1.0"
description = "Turn JUnit test failures into compact, redacted context for coding assistants."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Hafid Idrissi"}]
keywords = ["junit", "testing", "claude-code", "codex", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.scripts]
junit2context = "junit2context.cli:main"

[project.urls]
Homepage = "https://github.com/HafidIdrissi/junit2context"
Issues = "https://github.com/HafidIdrissi/junit2context/issues"

[tool.setuptools.packages.find]
where = ["src"]
