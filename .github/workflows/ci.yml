name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: junit2context examples/pytest.xml examples/vitest.xml
      - run: junit2context examples/pytest.xml --format json

  generated-artifacts:
    name: Generated demo artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate demo and sample brief
        run: python3 scripts/build_demo.py
      - name: Check committed artifacts are current
        run: |
          if ! git diff --exit-code -- docs/demo.html examples/brief.md; then
            echo "::error::Generated artifacts are stale. Run python3 scripts/build_demo.py, review docs/demo.html and examples/brief.md, and commit their updates."
            exit 1
          fi
